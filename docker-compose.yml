services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wtfiwant
      POSTGRES_USER: wtfiwant
      POSTGRES_PASSWORD: wtfiwant
    ports:
      - "5432:5432"
    volumes:
      - wtfiwant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtfiwant -d wtfiwant"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://wtfiwant:wtfiwant@postgres:5432/wtfiwant
      API_PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "bun run db:migrate && bun run start:prod"]

volumes:
  wtfiwant_postgres:
