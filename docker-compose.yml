services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wtfiwant
      POSTGRES_USER: wtfiwant
      POSTGRES_PASSWORD: wtfiwant
    ports:
      - "5432:5432"
    volumes:
      - wtfiwant_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wtfiwant -d wtfiwant"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://wtfiwant:wtfiwant@postgres:5432/wtfiwant
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wtfiwant_postgres:
